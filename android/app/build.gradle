plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Load keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ai.tunio.radioplayer"
    compileSdk = 36
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
        rustore {
            if (keystorePropertiesFile.exists() && keystoreProperties['rustoreKeyAlias']) {
                keyAlias keystoreProperties['rustoreKeyAlias']
                keyPassword keystoreProperties['rustoreKeyPassword']
                storeFile keystoreProperties['rustoreStoreFile'] ? file(keystoreProperties['rustoreStoreFile']) : null
                storePassword keystoreProperties['rustoreStorePassword']
            }
        }
    }

    defaultConfig {
        applicationId = "ai.tunio.radioplayer"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    flavorDimensions += "distribution"
    productFlavors {
        // Google Play distribution
        play {
            dimension = "distribution"
            signingConfig signingConfigs.release
        }
        // Direct/standalone APK with in-app self-update
        standalone {
            dimension = "distribution"
            signingConfig signingConfigs.release
        }
        // RuStore distribution: separate signing key, no self-update.
        // Signing config is set per-flavor (not per-buildType) so the release
        // build type can use the right key for each distribution channel.
        rustore {
            dimension = "distribution"
            if (keystorePropertiesFile.exists() && keystoreProperties['rustoreKeyAlias']) {
                signingConfig signingConfigs.rustore
            } else {
                signingConfig signingConfigs.release
            }
        }
        // Evotor.Market distribution: Evotor smart terminals run Evotor OS 4
        // (Android 7.1) on 32-bit MediaTek MT8321A, so this flavor ships only
        // armeabi-v7a. No self-update (APP_FLAVOR=evotor disables it), installs
        // go through Evotor.Market. Falls back to debug signing when
        // key.properties is absent so local verification builds work.
        evotor {
            dimension = "distribution"
            ndk {
                abiFilters "armeabi-v7a"
            }
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    buildTypes {
        // No signingConfig here: the release build type inherits the signing
        // config from the active product flavor (see productFlavors above).
        // The implicit debug build type keeps its own debug signing config.
        release {
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-datasource:1.4.1"
    implementation "androidx.media3:media3-database:1.4.1"
}
